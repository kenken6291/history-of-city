<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私の街の歴史 - 写真重ね合わせ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <button type="button" class="site-header__half site-header__half--past" data-scroll-target="uploadSection">
    <div>
      <p class="site-header__title">私の街の歴史</p>
      <p class="site-header__sub">昔の写真 × 今の風景</p>
    </div>
  </button>
  <button type="button" class="site-header__half site-header__half--now" data-scroll-target="gallerySection">
    <div>
      <p class="site-header__title" style="visibility:hidden;">私の街の歴史</p>
      <p class="site-header__sub">スライダーで見比べる、まちの変化</p>
    </div>
  </button>
</header>

<div class="member-bar" id="memberBar">
  <span id="loginOpenBtn">ログイン</span>
  <span id="registerOpenBtn">会員登録</span>
</div>

<main>

  <section id="uploadSection">
    <h2 class="section-title">写真を投稿する</h2>
    <form class="upload-form" id="uploadForm">
      <label>
        場所の名前
        <input type="text" id="locationName" placeholder="例：〇〇商店街、△△駅前" required>
      </label>
      <label>
        昔の写真
        <input type="file" id="oldPhotoInput" accept="image/*" required>
      </label>
      <label>
        現在の写真（同じ場所・同じ角度で撮影）
        <input type="file" id="newPhotoInput" accept="image/*" required>
      </label>
      <label>
        コメント（任意）
        <textarea id="userComment" placeholder="思い出や気づいたことなど"></textarea>
      </label>
      <button type="submit" class="btn btn--past" id="uploadSubmitBtn">投稿する（要ログイン）</button>
      <p class="modal-msg" id="uploadMsg"></p>
    </form>
  </section>

  <section id="gallerySection">
    <h2 class="section-title">みんなの投稿</h2>
    <div id="galleryList">読み込み中...</div>
  </section>

</main>

<!-- ログインモーダル -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <h2>ログイン</h2>
    <label>メールアドレス<input type="text" id="loginEmail"></label>
    <label>パスワード
      <span class="password-field">
        <input type="password" id="loginPassword">
        <button type="button" class="password-toggle" data-target="loginPassword">表示</button>
      </span>
    </label>
    <button class="btn btn--now" id="loginSubmitBtn">ログイン</button>
    <p class="modal-msg" id="loginMsg"></p>
    <div class="modal-links">
      <a id="toRegisterLink">会員登録はこちら</a>
      <a id="toReissueLink">パスワードを忘れた方</a>
    </div>
    <div class="modal-links"><a id="closeLoginLink">閉じる</a></div>
  </div>
</div>

<!-- 会員登録モーダル -->
<div class="modal-overlay" id="registerModal">
  <div class="modal-box">
    <h2>会員登録</h2>
    <label>メールアドレス<input type="text" id="registerEmail"></label>
    <label>ニックネーム<input type="text" id="registerNickname"></label>
    <button class="btn btn--now" id="registerSubmitBtn">登録する</button>
    <p class="modal-msg" id="registerMsg"></p>
    <div class="modal-links"><a id="closeRegisterLink">閉じる</a></div>
  </div>
</div>

<!-- 初回パスワード変更モーダル -->
<div class="modal-overlay" id="forceChangeModal">
  <div class="modal-box">
    <h2>初回ログイン：パスワード変更</h2>
    <p style="font-size:0.82rem;">仮パスワードでのログインです。新しいパスワードを設定してください。</p>
    <label>新しいパスワード
      <span class="password-field">
        <input type="password" id="newPasswordInput">
        <button type="button" class="password-toggle" data-target="newPasswordInput">表示</button>
      </span>
    </label>
    <button class="btn btn--now" id="forceChangeSubmitBtn">変更する</button>
    <p class="modal-msg" id="forceChangeMsg"></p>
  </div>
</div>

<!-- パスワード再発行モーダル -->
<div class="modal-overlay" id="reissueModal">
  <div class="modal-box">
    <h2>パスワード再発行</h2>
    <label>メールアドレス<input type="text" id="reissueEmail"></label>
    <button class="btn btn--now" id="reissueSubmitBtn">再発行する</button>
    <p class="modal-msg" id="reissueMsg"></p>
    <div class="modal-links"><a id="closeReissueLink">閉じる</a></div>
  </div>
</div>

<!-- マイページモーダル（ニックネーム変更・退会） -->
<div class="modal-overlay" id="myPageModal">
  <div class="modal-box">
    <h2>マイページ</h2>
    <label>ニックネーム<input type="text" id="myNicknameInput"></label>
    <button class="btn btn--now" id="nicknameSubmitBtn">ニックネームを変更</button>
    <p class="modal-msg" id="myPageMsg"></p>
    <hr style="border-color: var(--line); margin: 18px 0;">
    <button class="btn btn--ghost" id="logoutBtn">ログアウト</button>
    <button class="btn" style="background:var(--danger); color:#fff; margin-left:8px;" id="withdrawBtn">退会する</button>
    <div class="modal-links"><a id="closeMyPageLink">閉じる</a></div>
  </div>
</div>

<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
